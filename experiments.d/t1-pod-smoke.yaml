# Smoke test for the pod runner: one sample of T1 canonical with a small model,
# small enough to run on a laptop's CPU in the pod-runner image. It checks the
# plumbing (Ollama starts, the model pulls, a job runs, results sync), not the
# model. See docs/running.md, "Test the pod runner locally".
#
# No facts: with the contributed facts' longer prompt, the 1.5B model loops
# until it hits max_tokens and never closes its code block, so nothing reaches
# DASM. Without them it writes a program, which the fixer and DASM then see.
# It rarely assembles, so racer-check is checked separately, with a reference
# program (docker/smoke-local.sh, "toolchain").
#
#   python -m tbd.eval.podrunner experiments.d/t1-pod-smoke.yaml --no-sync --dry-run
experiment: t1-pod-smoke

models:
  - { provider: ollama, model: "qwen2.5-coder:1.5b" }

facts: [none]

tasks:
  - { id: t1, variants: [canonical] }

modes: [one-shot]

samples: 1
seed: 103
temperature: 0.7
num_ctx: 8192
max_tokens: 2048
timeout: 900
random_seeds: 10
fix_syntax: true
