# Task 1 baseline (tbd-1nx.1): what local models know without facts, on the
# canonical wording and every variant, one-shot and with tool feedback.
#
#   python -m tbd.eval.experiment experiments.d/t1-baseline.yaml --dry-run
#   python -m tbd.eval.experiment experiments.d/t1-baseline.yaml
#
# Rerunning resumes: completed jobs are skipped. Output: experiments/t1-baseline/.
# Format: src/tbd/eval/experiment.py and docs/design/execution.md.
experiment: t1-baseline

models:
  - { provider: ollama, model: llama3.1 }
  - { provider: ollama, model: qwen2.5-coder }       # 7B
  - { provider: ollama, model: "qwen2.5-coder:14b" }

facts: [none]

tasks:
  - { id: t1, variants: all }

modes: [one-shot, tool-feedback]

samples: 3
seed: 42
temperature: 0.7
num_ctx: 8192
max_tokens: 4096
retries: 3
timeout: 900
