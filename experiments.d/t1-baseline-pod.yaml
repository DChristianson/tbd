# Task 1 baseline on a RunPod GPU pod (tbd-1nx.1): what six open models know
# about 2600 programming without facts, on the canonical wording and every
# variant, one-shot and with tool feedback. 6 models x 6 variants x 2 modes =
# 72 jobs, 10 samples each.
#
# Run t1-baseline-pod-trial.yaml first. It is this experiment's canonical
# one-shot jobs, one per model, with the same settings, and it shows each
# model's speed and whether it fits the card. Then run this definition. Resume
# skips the six jobs the trial completed, so none are rerun.
#
# Models: the three earlier baseline models (tbd-dpu.1), plus three that
# didn't fit the 16 GB Mac. qwen3.6:27b is the model the facts experiments
# use (t1-facts-qwen3.6-*.yaml), so the baseline gives them a reference.
#
# Settings: seed 42 for every model, as in t1-baseline.yaml and
# t1-baseline-runpod.yaml. Sample n uses seed 42 + n. qwen3.6:27b thinks
# before it answers, and glm-4.7-flash is expected to *(unchecked)*, so both
# get a larger context and output cap and longer timeouts, as in
# t1-facts-qwen3.6-pod.yaml. The trial shows whether glm-4.7-flash needs them.
# The syntax fixer stays off, so the baseline grades what the model wrote.
# Each check runs its check file's own 100 random power-on states.
#
# GPU memory: qwen3-coder (30.5B) and glm-4.7-flash (29.9B), both mixtures of
# experts, are 18.6 and 19.0 GB before their context cache, so a 24 GB card
# may be tight *(unchecked)*; the trial shows it. One job runs at a time.
#
#   python -m tbd.eval.podrunner experiments.d/t1-baseline-pod.yaml --no-sync --dry-run
experiment: t1-baseline-pod

models:
  - { provider: ollama, model: llama3.1 }                 # 8B
  - { provider: ollama, model: qwen2.5-coder }            # 7B
  - { provider: ollama, model: "qwen2.5-coder:14b" }
  - { provider: ollama, model: qwen3-coder }              # 30B, mixture of experts
  - { provider: ollama, model: "qwen3.6:27b", num_ctx: 20480, max_tokens: 16384,
      timeout: 1800, idle_timeout: 300 }
  - { provider: ollama, model: glm-4.7-flash, num_ctx: 20480, max_tokens: 16384,  # 30B, MoE
      timeout: 1800, idle_timeout: 300 }

facts: [none]

tasks:
  - { id: t1, variants: all }

modes: [one-shot, tool-feedback]

samples: 10
seed: 42
temperature: 0.7
num_ctx: 8192
max_tokens: 4096
retries: 3
timeout: 900
parallel: 1
