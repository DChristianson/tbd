# Case 0 / Task 1 in racer's check-file format (racer docs/checker.md):
# a stable NTSC frame with a solid red background. Checked per color clock,
# from a zeroed and 100 random power-on states. Build the ROM first:
#   cd tests/fixtures && dasm red_background.asm -f3 -obuild/red_background.bin
# then: racer-check tests/fixtures/red_background.check.toml

rom = "build/red_background.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
kind = "frame_length"
lines = 262

# Graded: sync starts on line 0 and lasts 2-4 lines' worth of clocks. "Stable
# framerate" allows sync to start a few cycles into its line (frame_length
# still pins the frame at exactly 262 lines).
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Informational (tbd.eval.case0 records it, it doesn't decide the grade):
# sync from the start of line 0 for exactly 3 lines, as racer's references do.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [40, 232]

# tbd.eval.case0 accepts $42-$46 here: if only the background fails and the
# color shown is in that range, it re-checks with that color.
[[property]]
name = "background"
kind = "constant_output"
lines = [40, 232]
clocks = [68, 228]
color = 0x42
