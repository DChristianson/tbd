# Vendored subset of racer (github.com/DChristianson/racer) at commit
# 9cc7b1d8550427d224f52958ca83abaadacee4fb: just enough to build racer-check.
# See NOTICE.md.
[workspace]
resolver = "2"
members = ["crates/sim", "crates/checkfile", "crates/checker"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.84"

[profile.release]
lto = true
codegen-units = 1
