# This file checks for a stable NTSC frame, red on the top half and blue on the bottom.
# To run it on the reference:
#   cd tasks/t1/split-tb && dasm reference.asm -f3 -I../../../vendor/atari2600 -obuild/reference.bin
#   racer-check check.toml

rom = "build/reference.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
kind = "frame_length"
lines = 262

# Graded: sync starts on line 0 and lasts 2-4 lines.
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Not graded (see check.py): sync for exactly 3 lines from the start of line 0.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [40, 232]

# The top 96 picture lines. check.py accepts $42-$46 here.
[[property]]
name = "top"
kind = "constant_output"
lines = [40, 136]
clocks = [68, 228]
color = 0x42

# The bottom 96 picture lines. check.py accepts $82-$86 here.
[[property]]
name = "bottom"
kind = "constant_output"
lines = [136, 232]
clocks = [68, 228]
color = 0x84
