# Task 1, blue variant, in racer's check-file format (racer docs/checker.md):
# a stable NTSC frame with a solid blue background. Checked per color clock,
# from a zeroed and 100 random power-on states. Build the ROM first:
#   cd tasks/t1/blue && dasm reference.asm -f3 -I../../../vendor/atari2600 -obuild/reference.bin
# then: racer-check tasks/t1/blue/check.toml

rom = "build/reference.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
kind = "frame_length"
lines = 262

# Graded: sync starts on line 0 and lasts 2-4 lines' worth of clocks. "Stable
# framerate" allows sync to start a few cycles into its line (frame_length
# still pins the frame at exactly 262 lines).
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Informational (check.py lists it; it does not decide the grade):
# sync from the start of line 0 for exactly 3 lines, as racer's references do.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [40, 232]

# check.py accepts $82-$86 here: if the background fails showing a
# color in that range, it re-checks with that color.
[[property]]
name = "background"
kind = "constant_output"
lines = [40, 232]
clocks = [68, 228]
color = 0x84
