# This file checks for a stable PAL frame with a solid red background.
# To run it on the reference:
#   cd tasks/t1/pal && dasm reference.asm -f3 -I../../../vendor/atari2600 -obuild/reference.bin
#   racer-check check.toml

rom = "build/reference.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
kind = "frame_length"
lines = 312

# Graded: sync starts on line 0 and lasts 2-4 lines.
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Not graded (see check.py): sync for exactly 3 lines from the start of line 0.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [48, 276]

# check.py accepts $62-$66 here.
[[property]]
name = "background"
kind = "constant_output"
lines = [48, 276]
clocks = [68, 228]
color = 0x62
