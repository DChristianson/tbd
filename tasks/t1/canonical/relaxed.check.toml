# Case 0 / Task 1, relaxed tier. The grader runs this when the strict
# check (check.toml) fails: passing it makes the attempt a near
# miss. Same frame, with slack where "stable framerate" leaves room:
#   - frame length 262 +/- 2 lines (not the NTSC standard, but stable)
#   - the 192-line red picture may start on lines 38-42 (strict: line 40)
# Uses tbd's additions to racer's checker (vendor/racer/NOTICE.md).

rom = "build/reference.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
name = "frame_length_range"
kind = "frame_length_range"
min_lines = 260
max_lines = 264

[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# check.py accepts $42-$46 here, as in the strict tier.
[[property]]
name = "picture"
kind = "picture_block"
lines = 192
start_window = [38, 43]
clocks = [68, 228]
color = 0x42
