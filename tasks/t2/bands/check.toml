# This file checks for a stable NTSC frame with 8-line stripes, each $10 more than the one above.
# To run it on the reference:
#   cd tasks/t2/bands && dasm reference.asm -f3 -I../../../vendor/atari2600 -obuild/reference.bin
#   racer-check check.toml

rom = "build/reference.bin"

[run]
frames = 100
skip_frames = 1
zero = true
random_seeds = 100

[[property]]
kind = "frame_length"
lines = 262

# Graded: sync starts on line 0 and lasts 2-4 lines.
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Not graded (see check.py): sync for exactly 3 lines from the start of line 0.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [40, 232]

# Picture line n shows (n / 8) * $10, mod 256.
[[property]]
name = "bands"
kind = "output_colors"
lines = [40, 232]
clocks = [68, 228]
colors = [
  0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10,
  0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30,
  0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50,
  0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70,
  0x80, 0x80, 0x80, 0x80, 0x80, 0x80, 0x80, 0x80, 0x90, 0x90, 0x90, 0x90, 0x90, 0x90, 0x90, 0x90,
  0xa0, 0xa0, 0xa0, 0xa0, 0xa0, 0xa0, 0xa0, 0xa0, 0xb0, 0xb0, 0xb0, 0xb0, 0xb0, 0xb0, 0xb0, 0xb0,
  0xc0, 0xc0, 0xc0, 0xc0, 0xc0, 0xc0, 0xc0, 0xc0, 0xd0, 0xd0, 0xd0, 0xd0, 0xd0, 0xd0, 0xd0, 0xd0,
  0xe0, 0xe0, 0xe0, 0xe0, 0xe0, 0xe0, 0xe0, 0xe0, 0xf0, 0xf0, 0xf0, 0xf0, 0xf0, 0xf0, 0xf0, 0xf0,
  0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10, 0x10,
  0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x20, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30,
  0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x40, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50, 0x50,
  0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x60, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70, 0x70,
]

# Not graded (see check.py): COLUBK is written only in horizontal blank.
[[property]]
name = "colubk_in_hblank"
kind = "write_window"
chip = "tia"
register = "COLUBK"
lines = [40, 232]
clocks = [0, 68]
