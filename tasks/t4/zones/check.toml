# This file checks for a stable NTSC frame with three moving objects that never share a line.
# To run it on the reference:
#   cd tasks/t4/zones && dasm reference.asm -f3 -I../../../vendor/atari2600 -obuild/reference.bin
#   racer-check check.toml

rom = "build/reference.bin"

[run]
frames = 200
skip_frames = 1
zero = true
random_seeds = 20

[[property]]
kind = "frame_length"
lines = 262

# Graded: sync starts on line 0 and lasts 2-4 lines.
[[property]]
name = "vsync_span"
kind = "signal_span"
signal = "sync"
first_line = 0
min_clocks = 456
max_clocks = 912

# Not graded (see check.py): sync for exactly 3 lines from the start of line 0.
[[property]]
name = "vsync"
kind = "signal_on_lines"
signal = "sync"
first_line = 0
lines = 3

[[property]]
name = "blanking"
kind = "blank_outside"
lines = [40, 232]

# Not graded (see check.py): when the reference writes this register.
# Every line of each zone writes the player's row, before the visible line:
# picture lines 0-24, 27-112, and 115-191.
[[property]]
name = "grp0_zone1"
kind = "write_window"
chip = "tia"
register = "GRP0"
lines = [40, 65]
clocks = [0, 68]

# Not graded (see check.py): when the reference writes this register.
[[property]]
name = "grp0_zone2"
kind = "write_window"
chip = "tia"
register = "GRP0"
lines = [67, 153]
clocks = [0, 68]

# Not graded (see check.py): when the reference writes this register.
[[property]]
name = "grp0_zone3"
kind = "write_window"
chip = "tia"
register = "GRP0"
lines = [155, 232]
clocks = [0, 68]

# Not graded (see check.py): when the reference writes this register.
# Each change strobes the player on its second line, and moves it on its
# third, with HMOVE at its start.
[[property]]
name = "resp0_change1"
kind = "write_window"
chip = "tia"
register = "RESP0"
lines = [65, 66]
clocks = [0, 228]

# Not graded (see check.py): when the reference writes this register.
[[property]]
name = "hmove_change1"
kind = "write_window"
chip = "tia"
register = "HMOVE"
lines = [66, 67]
clocks = [0, 12]

# Not graded (see check.py): when the reference writes this register.
[[property]]
name = "resp0_change2"
kind = "write_window"
chip = "tia"
register = "RESP0"
lines = [153, 154]
clocks = [0, 228]

# Not graded (see check.py): when the reference writes this register.
[[property]]
name = "hmove_change2"
kind = "write_window"
chip = "tia"
register = "HMOVE"
lines = [154, 155]
clocks = [0, 12]

